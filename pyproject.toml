[project]
name = "neurachess"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.2.0",
    "fastapi[standard]>=0.165.0",
    "httpx2>=2.16.2",
    "huggingface-hub>=2.4.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "python-chess>=1.999",
    "torch>=2.15.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
